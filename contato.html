<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contato | NavegaSeguro</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">

    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
             NavegaSeguro
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal"
                aria-label="Abrir menu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Início</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="sobre.html">Sobre</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="informacoes.html">Informações</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="contato.html">Contato</a>
                </li>

            </ul>

        </div>

    </div>

</nav>

</header>


<main>

<section class="page-header">

    <div class="container text-center">

        <span class="badge text-bg-primary mb-3">
            FALE CONOSCO
        </span>

        <h1 class="display-5 fw-bold">
            Entre em contato
        </h1>

        <p class="lead">
            Envie uma sugestão de conteúdo para o NavegaSeguro.
        </p>

    </div>

</section>


<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card border-0 shadow">

                    <div class="card-body p-4 p-md-5">

                        <h2 class="h4 fw-bold mb-4">
                            Formulário de sugestão
                        </h2>

                        <form id="formContato">

                            <div class="row g-3">

                                <div class="col-md-6">

                                    <label for="nome" class="form-label">
                                        Nome completo
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           id="nome"
                                           name="nome"
                                           placeholder="Digite seu nome"
                                           required>

                                </div>


                                <div class="col-md-6">

                                    <label for="email" class="form-label">
                                        E-mail
                                    </label>

                                    <input type="email"
                                           class="form-control"
                                           id="email"
                                           name="email"
                                           placeholder="exemplo@email.com"
                                           required>

                                </div>


                                <div class="col-md-6">

                                    <label for="idade" class="form-label">
                                        Idade
                                    </label>

                                    <input type="number"
                                           class="form-control"
                                           id="idade"
                                           name="idade"
                                           min="10"
                                           max="100"
                                           placeholder="Sua idade">

                                </div>


                                <div class="col-md-6">

                                    <label for="assunto" class="form-label">
                                        Assunto
                                    </label>

                                    <select class="form-select"
                                            id="assunto"
                                            name="assunto"
                                            required>

                                        <option value="" selected>
                                            Selecione
                                        </option>

                                        <option value="senhas">
                                            Senhas
                                        </option>

                                        <option value="golpes">
                                            Golpes digitais
                                        </option>

                                        <option value="privacidade">
                                            Privacidade
                                        </option>

                                        <option value="redes">
                                            Redes sociais
                                        </option>

                                        <option value="outro">
                                            Outro
                                        </option>

                                    </select>

                                </div>


                                <div class="col-12">

                                    <label for="data" class="form-label">
                                        Data da sugestão
                                    </label>

                                    <input type="date"
                                           class="form-control"
                                           id="data"
                                           name="data">

                                </div>


                                <div class="col-12">

                                    <label for="mensagem" class="form-label">
                                        Mensagem
                                    </label>

                                    <textarea class="form-control"
                                              id="mensagem"
                                              name="mensagem"
                                              rows="5"
                                              placeholder="Escreva sua sugestão..."
                                              required></textarea>

                                </div>


                                <div class="col-12">

                                    <div class="form-check">

                                        <input class="form-check-input"
                                               type="checkbox"
                                               id="aceite"
                                               required>

                                        <label class="form-check-label" for="aceite">
                                            Confirmo que as informações preenchidas
                                            são verdadeiras.
                                        </label>

                                    </div>

                                </div>


                                <div class="col-12">

                                    <button type="submit"
                                            class="btn btn-primary btn-lg w-100">
                                        Enviar sugestão
                                    </button>

                                </div>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

</main>


<footer class="footer bg-dark text-white py-4">

    <div class="container text-center">

        <p class="mb-0">
            NavegaSeguro — Projeto de Nicholas
        </p>

    </div>

</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>


<script>
   
    const formulario = document.getElementById("formContato");

    formulario.addEventListener("submit", function(event) {
        event.preventDefault();

        const nome = document.getElementById("nome").value;

        alert("Obrigado pela sugestão, " + nome + "!");

        formulario.reset();
    });
</script>
\n</body>

</html>
